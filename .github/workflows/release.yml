name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud:
    name: Mandatory real cloud integration (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    uses: ./.github/workflows/cloud-check.yml
    with:
      node-version: ${{ matrix.node }}

  validate:
    name: Validate tagged source (Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent FCPXML grammar validation
        run: |
          python3 -m pip install lxml==6.1.1
          python3 scripts/validate-fcpxml.py --prepare
      - name: Install locked dependencies and verify SQLite prebuilt binary
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and codec-capable Chrome
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Verify browser rendering and declared video capability
        run: pnpm exec node scripts/check-chromium.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm e2e
      - name: Large PSD time and memory acceptance
        run: node scripts/psd-benchmark.mjs .tmp/psd-benchmark.json
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-diagnostics-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Create release and generated notes
    needs: [validate, cloud]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Cura $GITHUB_REF_NAME"
