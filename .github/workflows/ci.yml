name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Mandatory real cloud integration
    uses: ./.github/workflows/cloud-check.yml

  check:
    name: Lint, types, unit tests and Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare independent FCPXML grammar validation
        run: |
          python3 -m pip install lxml==6.1.1
          python3 scripts/validate-fcpxml.py --prepare
      - name: Install locked dependencies and verify SQLite prebuilt binary
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and codec-capable Chrome
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Verify browser rendering and declared video capability
        run: pnpm exec node scripts/check-chromium.mjs
      - name: Lint and formatting
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Real-server Chromium E2E
        run: pnpm e2e
      - name: Large PSD time and memory acceptance
        run: node scripts/psd-benchmark.mjs .tmp/psd-benchmark.json
      - name: Print browser failure context
        if: failure()
        run: node scripts/print-e2e-diagnostics.mjs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
