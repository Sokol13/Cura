name: Release after verified CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-fallback-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish an explicitly requested milestone
    if: >-
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate request and publish immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-from-ci.mjs
